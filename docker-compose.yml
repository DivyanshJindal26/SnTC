services:
  app:
    build: .
    ports:
      # Host port (reverse proxy target for sntc.iitmandi.co.in) → container port
      - "${HOST_PORT:-8324}:3000"
    volumes:
      - app-data:/app/server/data
      - ./server/.env:/app/server/.env:ro
      # Service-account key is mounted (never baked into the image — see .dockerignore).
      # Path must match FIREBASE_SERVICE_ACCOUNT in server/.env.
      - ./server/service-account.json:/app/server/service-account.json:ro
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  app-data:
